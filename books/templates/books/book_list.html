{% extends 'books/base.html' %}
{% block content %}
<ul>
    {% for book in book_list %}
    <li>
        <a href="{% url 'books:book_detail' book.pk %}">{{book.title}}</a>
        <p>
            By
            {% for author in book.authors %}
            {{author}} 
            {% endfor %}
        </p>
        <p>{{book.score_avg}}</p>
    </li>
    {% endfor %}
</ul>
{% endblock %}
